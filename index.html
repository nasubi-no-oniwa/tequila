<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>テキーラ（試作）</title>
<style>
:root{--bg:#1b0f0a;--fg:#fff4e0;--sub:#e9c99a;--accent:#ffcc33;--hot:#ff5a36;--ok:#7be07b;--tv:#3a2416}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#tv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--tv);border-radius:14px;padding:8px 8px 14px;box-shadow:0 6px 0 #120905;z-index:5}
#tv:after{content:"";position:absolute;left:50%;bottom:4px;width:30px;height:5px;margin-left:-15px;border-radius:3px;background:#5a3a22}
#ytwrap{width:240px;height:200px;border-radius:6px;overflow:hidden;background:#000}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 232px);text-align:center;z-index:4;pointer-events:none}
#count{font-size:64px;font-weight:900;color:var(--accent);text-shadow:0 4px 0 #6b3b00;line-height:1}
#countLabel{font-size:13px;color:var(--sub)}
#msg{margin-top:6px;font-size:15px;color:var(--sub);min-height:1.4em}
#btn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);width:170px;height:170px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ff8a5c,var(--hot) 60%,#b52a12);color:#fff;font-size:30px;font-weight:900;box-shadow:0 10px 0 #7a1a08,0 0 0 6px #ffffff22;z-index:6;font-family:inherit;touch-action:manipulation}
#btn:active,#btn.down{transform:translateX(-50%) translateY(8px);box-shadow:0 2px 0 #7a1a08,0 0 0 6px #ffffff22}
#btn[disabled]{filter:grayscale(.8) brightness(.6)}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#1b0f0acc;padding:16px}
.card{background:#2a1810;border:3px solid var(--accent);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center}
.card h1{margin:0 0 6px;font-size:38px;color:var(--accent);letter-spacing:.05em}
.card p{margin:8px 0;line-height:1.6;font-size:14px;color:var(--sub)}
.card button{display:block;width:100%;margin-top:10px;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:800;font-family:inherit;background:var(--accent);color:#2a1300}
.card button.sub{background:#4a2c1a;color:var(--fg);font-size:15px}
.card textarea{width:100%;height:70px;font-size:13px;border-radius:8px;border:1px solid #6b4a30;background:#1b0f0a;color:var(--fg);padding:6px}
#pop{position:fixed;left:0;right:0;top:42%;text-align:center;font-size:56px;font-weight:900;color:var(--accent);text-shadow:0 5px 0 #7a1a08;z-index:7;pointer-events:none;opacity:0;transition:none}
#pop.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(.4)}25%{transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-40px)}}
#regList{font-size:13px;color:var(--fg);min-height:1.4em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tv"><div id="ytwrap"><div id="yt"></div></div></div>
<div id="hud"><div id="count">0</div><div id="countLabel">テキーラ成功</div><div id="msg">読み込み中…</div></div>
<div id="pop">テキーラ！</div>
<button id="btn" disabled>テキーラ！</button>

<div class="panel" id="title" hidden>
 <div class="card">
  <h1>テキーラ</h1>
  <p>曲のサビがずっとループします。<br>「テキーラ！」の瞬間にボタンを押してください。<br>1回でも押しそびれたら終わり。</p>
  <p id="best">さいこう記録：0回</p>
  <p style="font-size:12px">広告が出たらテレビのスキップを押してね</p>
  <button id="startBtn">はじめる</button>
  <button class="sub" id="regBtn">タイミング登録（試作用）</button>
 </div>
</div>

<div class="panel" id="regPanel" hidden>
 <div class="card">
  <h1 style="font-size:24px">タイミング登録</h1>
  <p>曲の頭から流れます。<br>①サビが始まったら「サビ開始」<br>②「テキーラ！」と聞こえた瞬間に大きいボタン<br>③サビが終わったら「サビ終わり」<br>ゲームではこのサビだけがずっとループします。</p>
  <p id="regList">まだなし</p>
  <button id="regStart">登録をはじめる</button>
    <p style="font-size:12px;margin-top:14px">登録した秒数（Claudeに送るとそのまま本番に入れます）</p>
  <textarea id="regText" readonly></textarea>
  <button class="sub" id="regCopy">コピー</button>
  <button class="sub" id="regDone">もどる</button>
 </div>
</div>

<div class="panel" id="over" hidden>
 <div class="card">
  <h1 id="overTitle">おしまい</h1>
  <p id="overText"></p>
  <button id="againBtn">もう一回</button>
  <button class="sub" id="toTitle">タイトルへ</button>
 </div>
</div>

<script>
// ===== 設定 =====
const VIDEO_ID='4hswHOEQfj8';
const WINDOW=0.3; // 前後0.3秒
// 仮の値。タイミング登録をすると上書きされる
let CFG={hits:[],loopFrom:0,loopTo:0};
try{const s=JSON.parse(localStorage.getItem('tequila_cfg')||'null');if(s&&Array.isArray(s.hits))CFG=s;}catch(e){}
let best=0;try{best=+localStorage.getItem('tequila_best')||0}catch(e){}

const $=id=>document.getElementById(id);
let player=null,ready=false;
let mode='title'; // title / play / reg / over
let ytT=0,ytAt=0,playing=false;
let count=0,hitDone=[],started=false;
let reg={hits:[],loopFrom:-1,loopTo:0};

// ===== YouTube =====
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
 player=new YT.Player('yt',{width:240,height:200,videoId:VIDEO_ID,
  playerVars:{controls:0,disablekb:1,playsinline:1,rel:0,fs:0,iv_load_policy:3,modestbranding:1},
  events:{onReady:()=>{ready=true;showTitle();},onStateChange:onState,onError:e=>{$('msg').textContent='動画を読み込めませんでした（エラー'+e.data+'）';}}});
};
function onState(e){
 playing=(e.data===1);
 if(e.data===1){ytT=player.getCurrentTime();ytAt=performance.now();}
 if(e.data===2&&mode==='play'&&started){gameOver('止めた');}
 if(e.data===0){ // 最後まで行った場合も頭へ
  if(mode==='play'){doLoop();}
  if(mode==='reg'){loopFloat.onclick();}
 }
}
// なめらかな現在時刻（getCurrentTimeは粗いので補間）
function now(){
 if(!player||!ready)return 0;
 const t=player.getCurrentTime();
 const p=performance.now();
 if(t!==ytT){ytT=t;ytAt=p;}
 return playing?ytT+(p-ytAt)/1000:ytT;
}
function loopRange(){
 const dur=player.getDuration()||135;
 const to=CFG.loopTo>0?CFG.loopTo:dur-0.3;
 return {from:CFG.loopFrom||0,to};
}
function doLoop(){
 const r=loopRange();
 player.seekTo(r.from,true);player.playVideo();
 ytT=r.from;ytAt=performance.now();
 hitDone=CFG.hits.map(()=>false);
}

// ===== 画面 =====
function show(id){['title','regPanel','over'].forEach(p=>$(p).hidden=(p!==id));}
function showTitle(){
 mode='title';show('title');$('btn').disabled=true;
 $('best').textContent='さいこう記録：'+best+'回';
 $('msg').textContent=CFG.hits.length?'':'先に「タイミング登録」をしてね';
 $('startBtn').disabled=!CFG.hits.length;
 $('startBtn').style.opacity=CFG.hits.length?1:.4;
}
$('startBtn').onclick=()=>{if(CFG.hits.length)startGame();};
$('regBtn').onclick=()=>{show('regPanel');mode='regwait';updReg();};
$('regDone').onclick=()=>{try{player.pauseVideo()}catch(e){}showTitle();};
$('toTitle').onclick=showTitle;
$('againBtn').onclick=startGame;

function startGame(){
 show(null);mode='play';count=0;started=false;
 hitDone=CFG.hits.map(()=>false);
 $('count').textContent='0';$('msg').textContent='曲が始まるのを待ってね';
 $('btn').disabled=false;
 player.seekTo(CFG.loopFrom||0,true);player.playVideo();
 dancer.state='dance';
}
function gameOver(why){
 if(mode!=='play')return;
 mode='over';$('btn').disabled=true;
 try{player.pauseVideo()}catch(e){}
 const valid=why!=='止めた';
 if(valid&&count>best){best=count;try{localStorage.setItem('tequila_best',best)}catch(e){}}
 $('overTitle').textContent=valid?'テキーラ…':'中断';
 $('overText').innerHTML=valid?('テキーラ成功 <b style="font-size:28px;color:var(--accent)">'+count+'</b> 回<br>さいこう記録：'+best+'回'):'動画が止まったので、記録なしです';
 dancer.state='fall';dancer.t=0;
 setTimeout(()=>show('over'),900);
}

// ===== タイミング登録 =====
function updReg(){
 $('regList').textContent=(reg.hits.length||reg.loopFrom>=0)?(reg.loopFrom>=0?'サビ '+reg.loopFrom.toFixed(2)+'秒〜 ／ ':'')+reg.hits.map(h=>h.toFixed(2)+'秒').join(' / ')+'':'まだなし';
 const c=CFG.hits.length?CFG:null;
 $('regText').value=c?JSON.stringify({hits:c.hits.map(h=>+h.toFixed(2)),loopFrom:+(+c.loopFrom).toFixed(2),loopTo:+(+c.loopTo).toFixed(2)}):'';
}
$('regStart').onclick=()=>{
 reg={hits:[],loopFrom:-1,loopTo:0};mode='reg';updReg();
 $('regPanel').hidden=true;$('btn').disabled=false;
 $('msg').textContent='登録中：サビが始まったら右の「サビ開始」';
 player.seekTo(0,true);player.playVideo();
 // 登録中もループボタンを押せるように小さく出す
 loopFloat.hidden=false;loopFloat.textContent='サビ開始';
};
const loopFloat=document.createElement('button');
loopFloat.textContent='サビ開始';
Object.assign(loopFloat.style,{position:'fixed',right:'12px',bottom:'calc(env(safe-area-inset-bottom,0px) + 210px)',zIndex:8,padding:'10px 12px',borderRadius:'10px',border:'none',background:'#4a2c1a',color:'#fff4e0',fontWeight:'800',fontFamily:'inherit'});
loopFloat.hidden=true;document.body.appendChild(loopFloat);
loopFloat.onclick=(e)=>{
 const t=now();
 if(reg.loopFrom<0&&e){reg.loopFrom=t;reg.hits=[];loopFloat.textContent='サビ終わり';$('msg').textContent='サビ開始 '+t.toFixed(2)+'秒：「テキーラ！」で押す';updReg();return;}
 if(reg.loopFrom<0)reg.loopFrom=0;
 reg.loopTo=t;
 CFG={hits:reg.hits.filter(h=>h>=reg.loopFrom&&h<reg.loopTo),loopFrom:reg.loopFrom,loopTo:reg.loopTo};
 try{localStorage.setItem('tequila_cfg',JSON.stringify(CFG))}catch(e){}
 try{player.pauseVideo()}catch(e){}
 loopFloat.hidden=true;$('btn').disabled=true;mode='regwait';
 show('regPanel');updReg();
};
$('regCopy').onclick=()=>{const t=$('regText');try{navigator.clipboard.writeText(t.value).catch(()=>{t.select()})}catch(e){t.select()}};

// ===== ボタン =====
function press(){
 if($('btn').disabled)return;
 $('btn').classList.add('down');setTimeout(()=>$('btn').classList.remove('down'),90);
 const t=now();
 if(mode==='reg'){if(reg.loopFrom<0){$('msg').textContent='先に「サビ開始」を押してね';return;}if(t>0.05){reg.hits.push(t);updReg();$('msg').textContent='登録 '+reg.hits.length+'回目：'+t.toFixed(2)+'秒';flash();}return;}
 if(mode!=='play')return;
 for(let i=0;i<CFG.hits.length;i++){
  if(!hitDone[i]&&Math.abs(t-CFG.hits[i])<=WINDOW){
   hitDone[i]=true;count++;$('count').textContent=count;$('msg').textContent='';
   flash();dancer.state='jump';dancer.t=0;return;
  }
 }
 // テキーラ以外で押してもOK（何も起きない）
 dancer.shake=0.25;
}
$('btn').addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press();}});
function flash(){const p=$('pop');p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}

// ===== 毎フレームの判定 =====
function tick(){
 if(mode==='play'){
  const t=now();
  if(!started&&playing&&t>=(CFG.loopFrom||0)-0.2&&t>0.05){started=true;$('msg').textContent='';}
  if(started){
   const r=loopRange();
   if(t>=r.to){doLoop();}
   else for(let i=0;i<CFG.hits.length;i++){
    if(!hitDone[i]&&CFG.hits[i]>=r.from&&CFG.hits[i]<r.to&&t>CFG.hits[i]+WINDOW){gameOver('のがした');break;}
   }
  }
 }
 if(mode==='reg'){
  const t=now();
  // 登録中に曲が終わったら自動でループ位置を最後に
 }
}
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x1b0f0a);
const cam=new THREE.PerspectiveCamera(40,1,0.1,100);
S.add(new THREE.HemisphereLight(0xfff0d0,0x3a2010,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(3,6,4);S.add(dl);
// 床（タイル）
const floor=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshStandardMaterial({color:0x8a3b1e,roughness:.9}));
floor.rotation.x=-Math.PI/2;S.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.35,48),new THREE.MeshBasicMaterial({color:0xffcc33}));
ring.rotation.x=-Math.PI/2;ring.position.y=.01;S.add(ring);
// 棒人間（つるっと）
const M=new THREE.MeshStandardMaterial({color:0xf2ede4,roughness:.35,metalness:.05});
const man=new THREE.Group();S.add(man);
const hip=new THREE.Group();hip.position.y=1.0;man.add(hip);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,8,16),M);torso.position.y=.38;hip.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,32,24),M);head.position.y=.95;hip.add(head);
// 帽子（ソンブレロ風）
const hatM=new THREE.MeshStandardMaterial({color:0xe0a030,roughness:.7});
const brim=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.03,32),hatM);brim.position.y=1.16;hip.add(brim);
const crown=new THREE.Mesh(new THREE.ConeGeometry(.2,.3,24),hatM);crown.position.y=1.32;hip.add(crown);
function limb(len){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CapsuleGeometry(.065,len,6,12),M);m.position.y=-len/2;g.add(m);g.userData.len=len;return g;}
const armL=limb(.6),armR=limb(.6);armL.position.set(-.2,.68,0);armR.position.set(.2,.68,0);hip.add(armL,armR);
const legL=limb(.8),legR=limb(.8);legL.position.set(-.1,0,0);legR.position.set(.1,0,0);hip.add(legL,legR);
// マラカス
const mm=new THREE.MeshStandardMaterial({color:0xff5a36,roughness:.4});
function maraca(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),mm);b.scale.y=1.3;b.position.y=-.22;const h=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.2,8),new THREE.MeshStandardMaterial({color:0x7a4a20}));h.position.y=-.06;g.add(b,h);return g;}
const mL=maraca(),mR=maraca();mL.position.y=-.68;mR.position.y=-.68;armL.add(mL);armR.add(mR);
// サボテン
const cm=new THREE.MeshStandardMaterial({color:0x3f9b4a,roughness:.6});
for(const [x,z] of [[-2.6,-1.5],[2.8,-1.8]]){const c=new THREE.Mesh(new THREE.CapsuleGeometry(.22,1.2,6,12),cm);c.position.set(x,.8,z);S.add(c);const a=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.4,6,10),cm);a.position.set(x+.32,1.0,z);S.add(a);}

const d=window.dancer={state:'idle',t:0,shake:0};
let last=performance.now();
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 const far=w<h?7.2:5.2;cam.position.set(0,1.6,far);cam.lookAt(0,1.0,0);
 man.position.y=w<h?-0.9:-0.3;}
addEventListener('resize',fit);fit();
function loop(p){
 const dt=Math.min(.05,(p-last)/1000);last=p;
 if(window.tick)window.tick();
 const T=p/1000,beat=T*Math.PI*2*(176/60)/2;
 d.t+=dt;
 man.rotation.set(0,0,0);hip.position.y=1.0;
 if(d.state==='dance'||d.state==='idle'){
  const a=d.state==='dance'?1:.3;
  hip.position.y=1.0+Math.abs(Math.sin(beat))*.08*a;
  hip.rotation.z=Math.sin(beat)*.08*a;
  armL.rotation.z=-.9-Math.sin(beat*2)*.5*a;armR.rotation.z=.9-Math.sin(beat*2+1)*.5*a;
  armL.rotation.x=armR.rotation.x=0;
  legL.rotation.x=Math.sin(beat)*.3*a;legR.rotation.x=-Math.sin(beat)*.3*a;
  man.rotation.y=Math.sin(beat*.5)*.3*a;
 }else if(d.state==='jump'){
  const k=Math.min(1,d.t/.6),h=Math.sin(k*Math.PI);
  hip.position.y=1.0+h*.9;armL.rotation.z=-2.8;armR.rotation.z=2.8;
  legL.rotation.x=-.6*h;legR.rotation.x=.6*h;man.rotation.y=k*Math.PI*2;
  if(k>=1)d.state='dance';
 }else if(d.state==='fall'){
  const k=Math.min(1,d.t/.7);man.rotation.x=-k*Math.PI/2;hip.position.y=1.0-k*.75;
  armL.rotation.z=-.3;armR.rotation.z=.3;
 }
 if(d.shake>0){d.shake-=dt;head.rotation.z=Math.sin(p/30)*.3;}else head.rotation.z=0;
 ring.material.color.setHex(d.state==='jump'?0x7be07b:0xffcc33);
 R.render(S,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
