<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>テキーラ（試作）</title>
<style>
:root{--bg:#1b0f0a;--fg:#fff4e0;--sub:#e9c99a;--accent:#ffcc33;--hot:#ff5a36;--ok:#7be07b;--tv:#3a2416}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#tv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--tv);border-radius:14px;padding:8px 8px 14px;box-shadow:0 6px 0 #120905;z-index:5}
#tv:after{content:"";position:absolute;left:50%;bottom:4px;width:30px;height:5px;margin-left:-15px;border-radius:3px;background:#5a3a22}
#ytwrap{width:240px;height:200px;border-radius:6px;overflow:hidden;background:#000}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 232px);text-align:center;z-index:4;pointer-events:none}
#count{font-size:64px;font-weight:900;color:var(--accent);text-shadow:0 4px 0 #6b3b00;line-height:1}
#countLabel{font-size:13px;color:var(--sub)}
#msg{margin-top:6px;font-size:15px;color:var(--sub);min-height:1.4em}
#btnArea{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:170px;height:170px;margin-left:-85px;z-index:6}
#btn{position:absolute;inset:0;width:170px;height:170px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ff8a5c,var(--hot) 60%,#b52a12);color:#fff;font-size:30px;font-weight:900;box-shadow:0 10px 0 #7a1a08,0 0 0 6px #ffffff22;font-family:inherit;touch-action:manipulation;transition:box-shadow .08s}
#btn.down{transform:translateY(8px);box-shadow:0 2px 0 #7a1a08,0 0 0 6px #ffffff22}
#btn.now{box-shadow:0 10px 0 #7a1a08,0 0 0 8px var(--accent),0 0 40px 10px #ffcc3399}
#btn[disabled]{filter:grayscale(.8) brightness(.6)}
#ring{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:6px solid var(--accent);pointer-events:none;opacity:0}
#ring2{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:3px dashed #ffffff55;pointer-events:none;opacity:0}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#1b0f0acc;padding:16px}
.card{background:#2a1810;border:3px solid var(--accent);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center;max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font-size:38px;color:var(--accent);letter-spacing:.05em}
.card p{margin:8px 0;line-height:1.6;font-size:14px;color:var(--sub)}
.card button{display:block;width:100%;margin-top:10px;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:800;font-family:inherit;background:var(--accent);color:#2a1300}
.card button.sub{background:#4a2c1a;color:var(--fg);font-size:15px}
.card textarea{width:100%;height:70px;font-size:13px;border-radius:8px;border:1px solid #6b4a30;background:#1b0f0a;color:var(--fg);padding:6px}
#pop{position:fixed;left:0;right:0;top:42%;text-align:center;font-size:56px;font-weight:900;color:var(--accent);text-shadow:0 5px 0 #7a1a08;z-index:7;pointer-events:none;opacity:0}
#pop.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(.4)}25%{transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-40px)}}
#regList{font-size:13px;color:var(--fg);min-height:1.4em}
#emo{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:6;display:flex;flex-direction:column;gap:8px}
#emo button{width:56px;height:56px;border-radius:14px;border:none;background:#4a2c1acc;color:var(--fg);font-size:12px;font-weight:800;font-family:inherit;line-height:1.2}
#emo button:active{background:#6b4a30}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tv"><div id="ytwrap"><div id="yt"></div></div></div>
<div id="hud"><div id="count">0</div><div id="countLabel">テキーラ成功</div><div id="msg">読み込み中…</div></div>
<div id="pop">テキーラ！</div>
<div id="btnArea"><div id="ring2"></div><button id="btn" disabled>テキーラ！</button><div id="ring"></div></div>
<div id="emo">
 <button data-e="wave">手を<br>ふる</button>
 <button data-e="spin">くるっ</button>
 <button data-e="squat">コサック</button>
 <button data-e="flip">バク転</button>
</div>

<div class="panel" id="title" hidden>
 <div class="card">
  <h1>テキーラ</h1>
  <p>曲のサビがずっとループします。<br>「テキーラ！」の瞬間にボタンを押してください。<br>輪がボタンに重なったら押しどき。<br>1回でも押しそびれたら終わり。</p>
  <p id="best">さいこう記録：0回</p>
  <p style="font-size:12px">広告が出たらテレビのスキップを押してね</p>
  <button id="startBtn">はじめる</button>
  <button class="sub" id="regBtn">タイミング登録（試作用）</button>
 </div>
</div>

<div class="panel" id="regPanel" hidden>
 <div class="card">
  <h1 style="font-size:24px">タイミング登録</h1>
  <p>曲の頭から流れます。<br>①サビが始まったら右の「サビ開始」<br>②「テキーラ！」と聞こえた瞬間に大きいボタン<br>③サビが終わったところで「やめる」（そこでループします）<br>ゲームではこのサビだけがずっとループします。</p>
  <p id="regList">まだなし</p>
  <button id="regStart">登録をはじめる</button>
  <p style="font-size:12px;margin-top:14px">登録した秒数（Claudeに送るとそのまま本番に入れます）</p>
  <textarea id="regText" readonly></textarea>
  <button class="sub" id="regCopy">コピー</button>
  <button class="sub" id="regDone">もどる</button>
 </div>
</div>

<div class="panel" id="over" hidden>
 <div class="card">
  <h1 id="overTitle">おしまい</h1>
  <p id="overText"></p>
  <button id="againBtn">もう一回</button>
  <button class="sub" id="toTitle">タイトルへ</button>
 </div>
</div>

<script>
// ===== 設定 =====
const VIDEO_ID='4hswHOEQfj8';
const WINDOW=0.5;  // 前後0.5秒（合計1秒）
const LEAD=1.6;    // 輪が見え始める秒数
let CFG={hits:[],loopFrom:0,loopTo:0};
try{const s=JSON.parse(localStorage.getItem('tequila_cfg')||'null');if(s&&Array.isArray(s.hits)&&s.loopTo>s.loopFrom)CFG=s;}catch(e){}
let best=0;try{best=+localStorage.getItem('tequila_best')||0}catch(e){}

const $=id=>document.getElementById(id);
let player=null,ready=false;
let mode='title'; // title / play / regwait / reg / over
let baseT=0,baseAt=0,playing=false,guardUntil=0;
let count=0,hitDone=[],early=[],started=false;
let reg={hits:[],loopFrom:-1,loopTo:0};

// ===== YouTube =====
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
 player=new YT.Player('yt',{width:240,height:200,videoId:VIDEO_ID,
  playerVars:{controls:0,disablekb:1,playsinline:1,rel:0,fs:0,iv_load_policy:3,modestbranding:1},
  events:{onReady:()=>{ready=true;showTitle();},onStateChange:onState,onError:e=>{$('msg').textContent='動画を読み込めませんでした（エラー'+e.data+'）';}}});
};
function onState(e){
 const was=playing;playing=(e.data===1);
 if(playing&&!was&&performance.now()>guardUntil){baseT=player.getCurrentTime();baseAt=performance.now();}
 if(e.data===2&&mode==='play'&&started){gameOver('止めた');}
 if(e.data===0){
  if(mode==='play')doLoop();
  if(mode==='reg')finishReg();
 }
}
// なめらかな現在時刻：getCurrentTime は粗いので、時計で補間して大きくずれた時だけ合わせる
function now(){
 if(!player||!ready)return 0;
 const p=performance.now();
 let est=playing?baseT+(p-baseAt)/1000:baseT;
 const t=player.getCurrentTime();
 if(p<guardUntil){
  // ループ直後：シーク前の古い値は無視し、シーク先に着いたら合わせる
  if(Math.abs(t-est)<0.4){baseT=t;baseAt=p;guardUntil=0;est=t;}
  return est;
 }
 if(!playing){baseT=t;baseAt=p;return t;}
 if(Math.abs(t-est)>0.25){baseT=t;baseAt=p;est=t;}
 return est;
}
function range(){return {from:CFG.loopFrom,to:CFG.loopTo,len:CFG.loopTo-CFG.loopFrom};}
function doLoop(){
 const r=range();
 // ループ前に押しそびれが残っていないか
 if(mode==='play'&&started){for(let i=0;i<CFG.hits.length;i++)if(!hitDone[i]){gameOver('のがした');return;}}
 player.seekTo(r.from,true);player.playVideo();
 baseT=r.from;baseAt=performance.now();guardUntil=baseAt+1500;
 hitDone=CFG.hits.map((h,i)=>!!early[i]);early=[];
}

// ===== 画面 =====
function show(id){['title','regPanel','over'].forEach(p=>$(p).hidden=(p!==id));}
function showTitle(){
 mode='title';show('title');$('btn').disabled=true;
 $('best').textContent='さいこう記録：'+best+'回';
 const ok=CFG.hits.length>0;
 $('msg').textContent=ok?'':'先に「タイミング登録」をしてね';
 $('startBtn').disabled=!ok;$('startBtn').style.opacity=ok?1:.4;
 window.dancer&&(dancer.state='idle');
}
$('startBtn').onclick=()=>{if(CFG.hits.length)startGame();};
$('regBtn').onclick=()=>{show('regPanel');mode='regwait';updReg();};
$('regDone').onclick=()=>{try{player.pauseVideo()}catch(e){}loopFloat.hidden=true;showTitle();};
$('toTitle').onclick=showTitle;
$('againBtn').onclick=startGame;

function startGame(){
 show(null);mode='play';count=0;started=false;early=[];
 hitDone=CFG.hits.map(()=>false);
 $('count').textContent='0';$('msg').textContent='サビが始まるのを待ってね';
 $('btn').disabled=false;
 player.seekTo(CFG.loopFrom,true);player.playVideo();
 baseT=CFG.loopFrom;baseAt=performance.now();guardUntil=baseAt+1500;
 dancer.state='dance';dancer.t=0;
}
function gameOver(why){
 if(mode!=='play')return;
 mode='over';$('btn').disabled=true;ringOff();
 try{player.pauseVideo()}catch(e){}
 const valid=why!=='止めた';
 if(valid&&count>best){best=count;try{localStorage.setItem('tequila_best',best)}catch(e){}}
 $('overTitle').textContent=valid?'テキーラ…':'中断';
 $('overText').innerHTML=valid?('テキーラ成功 <b style="font-size:28px;color:var(--accent)">'+count+'</b> 回<br>さいこう記録：'+best+'回'):'動画が止まったので、記録なしです';
 dancer.state='fall';dancer.t=0;
 setTimeout(()=>show('over'),900);
}

// ===== タイミング登録 =====
function updReg(){
 $('regList').textContent=(reg.hits.length||reg.loopFrom>=0)?((reg.loopFrom>=0?'サビ '+reg.loopFrom.toFixed(2)+'秒〜 ／ ':'')+reg.hits.map(h=>h.toFixed(2)+'秒').join(' / ')):'まだなし';
 $('regText').value=CFG.hits.length?JSON.stringify({hits:CFG.hits.map(h=>+h.toFixed(2)),loopFrom:+(+CFG.loopFrom).toFixed(2),loopTo:+(+CFG.loopTo).toFixed(2)}):'';
}
const loopFloat=document.createElement('button');
Object.assign(loopFloat.style,{position:'fixed',right:'12px',bottom:'calc(env(safe-area-inset-bottom,0px) + 210px)',zIndex:8,padding:'14px 16px',borderRadius:'12px',border:'none',background:'#ffcc33',color:'#2a1300',fontWeight:'800',fontSize:'16px',fontFamily:'inherit'});
loopFloat.hidden=true;document.body.appendChild(loopFloat);
$('regStart').onclick=()=>{
 reg={hits:[],loopFrom:-1,loopTo:0};mode='reg';updReg();
 $('regPanel').hidden=true;$('btn').disabled=false;
 loopFloat.hidden=false;loopFloat.textContent='サビ開始';
 $('msg').textContent='サビが始まったら右の「サビ開始」';
 player.seekTo(0,true);player.playVideo();baseT=0;baseAt=performance.now();guardUntil=baseAt+1500;
 dancer.state='dance';
};
loopFloat.onclick=()=>{
 const t=now();
 if(reg.loopFrom<0){reg.loopFrom=t;reg.hits=[];loopFloat.textContent='やめる';$('msg').textContent='「テキーラ！」で大きいボタン';updReg();return;}
 reg.loopTo=t;finishReg();
};
function finishReg(){
 if(reg.loopFrom<0)reg.loopFrom=0;
 if(!reg.loopTo)reg.loopTo=now();
 const hits=reg.hits.filter(h=>h>=reg.loopFrom&&h<reg.loopTo);
 if(hits.length&&reg.loopTo>reg.loopFrom){CFG={hits,loopFrom:reg.loopFrom,loopTo:reg.loopTo};try{localStorage.setItem('tequila_cfg',JSON.stringify(CFG))}catch(e){}}
 try{player.pauseVideo()}catch(e){}
 loopFloat.hidden=true;$('btn').disabled=true;mode='regwait';
 show('regPanel');updReg();
}
$('regCopy').onclick=()=>{const t=$('regText');try{navigator.clipboard.writeText(t.value).catch(()=>{t.select()})}catch(e){t.select()}};

// ===== ボタン =====
// ループをまたいだ距離（いま→次のテキーラ）。iはどのテキーラか
function nextHit(t){
 const r=range();let bestD=Infinity,bi=-1,wrap=false;
 for(let i=0;i<CFG.hits.length;i++){
  let d=CFG.hits[i]-t,w=false;
  if(hitDone[i]&&d>-WINDOW){d+=r.len;w=true;}       // 今回は済み→次の周
  else if(d<-WINDOW){d+=r.len;w=true;}
  if(w&&early[i])continue;
  if(d<bestD){bestD=d;bi=i;wrap=w;}
 }
 return {d:bestD,i:bi,wrap};
}
function press(){
 if($('btn').disabled)return;
 const b=$('btn');b.classList.add('down');setTimeout(()=>b.classList.remove('down'),90);
 const t=now();
 if(mode==='reg'){
  if(reg.loopFrom<0){$('msg').textContent='先に右の「サビ開始」を押してね';return;}
  reg.hits.push(t);updReg();$('msg').textContent='テキーラ '+reg.hits.length+'回目：'+t.toFixed(2)+'秒';flash();dancer.emote(null);return;
 }
 if(mode!=='play'||!started)return;
 const n=nextHit(t);
 if(n.i>=0&&Math.abs(n.d)<=WINDOW){
  if(n.wrap)early[n.i]=true;else hitDone[n.i]=true;
  count++;$('count').textContent=count;flash();dancer.emote(null);return;
 }
 dancer.shake=0.25; // テキーラ以外で押してもOK
}
$('btn').addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press();}});
function flash(){const p=$('pop');p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}
document.querySelectorAll('#emo button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dancer.emote(b.dataset.e);}));

// ===== 輪 =====
function ringOff(){$('ring').style.opacity=0;$('ring2').style.opacity=0;$('btn').classList.remove('now');}
function drawRing(t){
 const n=nextHit(t);
 if(n.i<0||n.d>LEAD){ringOff();return;}
 const k=Math.max(0,n.d)/LEAD; // 1→0
 const s=1+k*1.4;
 const R=$('ring');R.style.opacity=Math.min(1,(1-k)*2.2);R.style.transform='scale('+s+')';
 const R2=$('ring2');R2.style.opacity=.8;R2.style.transform='scale(1.06)';
 $('btn').classList.toggle('now',Math.abs(n.d)<=WINDOW);
}

// ===== 毎フレーム =====
window.tick=function(){
 if(mode==='play'){
  const t=now();const r=range();
  if(!started&&playing&&performance.now()>guardUntil-1400&&t>=r.from-0.3&&t<r.to){started=true;$('msg').textContent='';}
  if(started){
   if(t>=r.to-0.06){doLoop();return;}
   for(let i=0;i<CFG.hits.length;i++){
    if(!hitDone[i]&&t>CFG.hits[i]+WINDOW&&t<r.to){gameOver('のがした');return;}
   }
   drawRing(t);
  }else ringOff();
 }else ringOff();
};
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x1b0f0a);
const cam=new THREE.PerspectiveCamera(40,1,0.1,100);
S.add(new THREE.HemisphereLight(0xfff0d0,0x3a2010,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(3,6,4);S.add(dl);
const floor=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshStandardMaterial({color:0x8a3b1e,roughness:.9}));
floor.rotation.x=-Math.PI/2;S.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.35,48),new THREE.MeshBasicMaterial({color:0xffcc33}));
ring.rotation.x=-Math.PI/2;ring.position.y=.01;S.add(ring);
// スポットライトの色が変わる
const spot=new THREE.PointLight(0xff8844,6,8);spot.position.set(0,3.2,1.5);S.add(spot);

const M=new THREE.MeshStandardMaterial({color:0xf2ede4,roughness:.35,metalness:.05});
const man=new THREE.Group();S.add(man);
const root=new THREE.Group();man.add(root);           // 回転・宙返り用
const hip=new THREE.Group();root.add(hip);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,8,16),M);torso.position.y=.38;hip.add(torso);
const neck=new THREE.Group();neck.position.y=.75;hip.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,32,24),M);head.position.y=.2;neck.add(head);
const hatM=new THREE.MeshStandardMaterial({color:0xe0a030,roughness:.7});
const brim=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.03,32),hatM);brim.position.y=.41;neck.add(brim);
const crown=new THREE.Mesh(new THREE.ConeGeometry(.2,.3,24),hatM);crown.position.y=.57;neck.add(crown);
function limb(len){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CapsuleGeometry(.065,len,6,12),M);m.position.y=-len/2;g.add(m);return g;}
const armL=limb(.6),armR=limb(.6);armL.position.set(-.2,.68,0);armR.position.set(.2,.68,0);hip.add(armL,armR);
const legL=limb(.8),legR=limb(.8);legL.position.set(-.1,0,0);legR.position.set(.1,0,0);hip.add(legL,legR);
const mm=new THREE.MeshStandardMaterial({color:0xff5a36,roughness:.4});
function maraca(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),mm);b.scale.y=1.3;b.position.y=-.22;const h=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.2,8),new THREE.MeshStandardMaterial({color:0x7a4a20}));h.position.y=-.06;g.add(b,h);return g;}
const mL=maraca(),mR=maraca();mL.position.y=-.68;mR.position.y=-.68;armL.add(mL);armR.add(mR);
const cm=new THREE.MeshStandardMaterial({color:0x3f9b4a,roughness:.6});
for(const [x,z] of [[-2.6,-1.5],[2.8,-1.8]]){const c=new THREE.Mesh(new THREE.CapsuleGeometry(.22,1.2,6,12),cm);c.position.set(x,.8,z);S.add(c);const a=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.4,6,10),cm);a.position.set(x+.32,1.0,z);S.add(a);}

// ===== 踊り =====
// 1つの踊り＝拍の角度bを受けてポーズを決める関数。y:腰の高さ、ry:体の向き
const P={};
function reset(){hip.position.set(0,1,0);hip.rotation.set(0,0,0);root.rotation.set(0,0,0);root.position.set(0,0,0);man.rotation.set(0,0,0);neck.rotation.set(0,0,0);
 for(const l of [armL,armR,legL,legR])l.rotation.set(0,0,0);}
const DANCES={
 sway(b){hip.position.y=1+Math.abs(Math.sin(b))*.08;hip.rotation.z=Math.sin(b)*.1;armL.rotation.z=-.9-Math.sin(b*2)*.5;armR.rotation.z=.9-Math.sin(b*2+1)*.5;legL.rotation.x=Math.sin(b)*.3;legR.rotation.x=-Math.sin(b)*.3;man.rotation.y=Math.sin(b*.5)*.3;},
 maracas(b){hip.position.y=.92+Math.abs(Math.sin(b*2))*.06;armL.rotation.x=-1.3+Math.sin(b*4)*.35;armR.rotation.x=-1.3-Math.sin(b*4)*.35;armL.rotation.z=-.2;armR.rotation.z=.2;legL.rotation.x=.25;legR.rotation.x=-.1;neck.rotation.x=Math.sin(b*2)*.15;},
 hips(b){hip.position.x=Math.sin(b)*.12;hip.rotation.z=-Math.sin(b)*.2;armL.rotation.z=-2.4+Math.sin(b)*.3;armR.rotation.z=.5;armR.rotation.x=-.4;legL.rotation.z=Math.sin(b)*.15;legR.rotation.z=Math.sin(b)*.15;neck.rotation.z=Math.sin(b)*.2;},
 kick(b){const s=Math.sin(b);hip.position.y=1+Math.abs(s)*.1;legL.rotation.x=s>0?-s*1.1:0;legR.rotation.x=s<0?s*1.1:0;armL.rotation.z=-1.2;armR.rotation.z=1.2;armL.rotation.x=armR.rotation.x=-s*.4;},
 arms(b){armL.rotation.z=-2.7+Math.sin(b*2)*.35;armR.rotation.z=2.7+Math.sin(b*2+Math.PI)*.35;hip.position.y=1+Math.abs(Math.sin(b))*.07;hip.rotation.z=Math.sin(b)*.08;legL.rotation.x=Math.sin(b)*.2;legR.rotation.x=-Math.sin(b)*.2;},
 chicken(b){const s=Math.sin(b*2);armL.rotation.z=-.6-Math.max(0,s)*.9;armR.rotation.z=.6+Math.max(0,s)*.9;armL.rotation.x=armR.rotation.x=.6;neck.position.z=Math.sin(b*2)*.08;hip.position.y=.95+Math.abs(Math.sin(b))*.05;legL.rotation.x=Math.sin(b)*.25;legR.rotation.x=-Math.sin(b)*.25;man.rotation.y=.5;},
};
const NAMES=Object.keys(DANCES);
// ===== エモート（決めポーズ） =====
const EMOTES={
 jump(k){const h=Math.sin(k*Math.PI);hip.position.y=1+h*.9;armL.rotation.z=-2.8;armR.rotation.z=2.8;legL.rotation.x=-.6*h;legR.rotation.x=.6*h;man.rotation.y=k*Math.PI*2;},
 pose(k){const e=Math.min(1,k*5);armR.rotation.z=2.9*e;armL.rotation.z=-.4;armL.rotation.x=-.3;hip.rotation.z=-.15*e;legL.rotation.z=-.25*e;legR.rotation.z=.12*e;neck.rotation.z=.25*e;hip.position.y=1+Math.sin(Math.min(1,k*5)*Math.PI)*.15;},
 flip(k){const h=Math.sin(k*Math.PI);root.position.y=h*1.1;root.rotation.x=-k*Math.PI*2;hip.position.y=1;armL.rotation.z=-2.5;armR.rotation.z=2.5;legL.rotation.x=legR.rotation.x=-.8*h;},
 wave(k){armR.rotation.z=2.5+Math.sin(k*Math.PI*8)*.4;armL.rotation.z=-.3;neck.rotation.z=.2;hip.rotation.z=Math.sin(k*Math.PI*4)*.06;},
 spin(k){man.rotation.y=k*Math.PI*4;armL.rotation.z=-1.5;armR.rotation.z=1.5;hip.position.y=1+Math.sin(k*Math.PI)*.15;legL.rotation.z=-.2;legR.rotation.z=.2;},
 squat(k){const s=Math.sin(k*Math.PI*6);hip.position.y=.62;legL.rotation.x=s>0?-1.4:-.1;legR.rotation.x=s<0?-1.4:-.1;legL.position.y=legR.position.y=0;armL.rotation.z=-1.55;armR.rotation.z=1.55;armL.rotation.x=armR.rotation.x=-1.2;},
};
const EMO_LEN={jump:.7,pose:1.0,flip:.9,wave:1.4,spin:1.0,squat:1.8};
const d=window.dancer={state:'idle',t:0,shake:0,cur:'sway',next:0,emo:null,et:0,
 emote(name){if(this.state==='fall')return;this.emo=name||['jump','pose','flip','spin'][Math.floor(Math.random()*4)];this.et=0;}};

let last=performance.now(),beatClock=0;
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 const far=w<h?7.6:5.4;cam.position.set(0,1.6,far);cam.lookAt(0,1.0,0);man.position.y=w<h?-0.9:-0.3;}
addEventListener('resize',fit);fit();
const COLORS=[0xff8844,0xff4477,0x44ccff,0xffdd33,0x77ff88];
function loop(p){
 const dt=Math.min(.05,(p-last)/1000);last=p;
 if(window.tick)window.tick();
 const amt=d.state==='dance'?1:.35;
 beatClock+=dt*(176/60)*Math.PI*amt; // 拍
 const b=beatClock;
 // 8拍ごとに踊りを変える
 if(d.state==='dance'&&b>d.next){let n;do{n=NAMES[Math.floor(Math.random()*NAMES.length)]}while(n===d.cur);d.cur=n;d.next=b+Math.PI*8;spot.color.setHex(COLORS[Math.floor(Math.random()*COLORS.length)]);}
 reset();legL.position.y=legR.position.y=0;neck.position.z=0;
 d.t+=dt;
 if(d.state==='fall'){
  const k=Math.min(1,d.t/.7);root.rotation.x=-k*Math.PI/2;root.position.y=k*.1;hip.position.y=1-k*.75;armL.rotation.z=-.3;armR.rotation.z=.3;
 }else if(d.emo){
  d.et+=dt;const L=EMO_LEN[d.emo];const k=Math.min(1,d.et/L);EMOTES[d.emo](k);if(k>=1)d.emo=null;
 }else{
  DANCES[d.state==='dance'?d.cur:'sway'](b*(d.state==='dance'?1:.6));
  if(d.state!=='dance'){armL.rotation.z*=.6;armR.rotation.z*=.6;}
 }
 if(d.shake>0){d.shake-=dt;neck.rotation.z+=Math.sin(p/30)*.3;}
 ring.material.color.setHex(d.emo?0x7be07b:0xffcc33);
 spot.intensity=d.state==='dance'?5+Math.abs(Math.sin(b))*4:3;
 R.render(S,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
